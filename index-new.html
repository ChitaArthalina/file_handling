<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Handling</title>
</head>
<body>
    <h3>Mengubah Tag HTML dalam File</h3>
        <form method="post" action="proses.php">
            <label>Nama File HTML:</label><br>
            <input type="text" name="inputFile" required><br><br>

            <label>Tag Asli:</label><br>
            <input type="text" name="tagLama" required><br><br>

            <label>Tag Baru:</label><br>
            <input type="text" name="tagBaru" required><br><br>

            <label>Tipe Keluaran (misalnya : O/N):</label><br>
            <input type="text" name="tipeOutput" maxlength="1" required><br><br>

            <input type="submit" name="submit" value="Submit">
    </form>

</body>
</html>
